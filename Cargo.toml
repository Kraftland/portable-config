[package]
name = "portable-config"
version = "21.0.0"
edition = "2024"
rust-version = "1.98"
description = "Configuration crate for the Portable Sandbox"
documentation = "https://github.com/Kraftland/portable"
readme = "README.md"
homepage = "https://github.com/Kraftland/portable-config"
repository = "https://github.com/Kraftland/portable-config"
license = "GPL-3.0-or-later"
keywords = ["Portable", "sandbox", "config", "serde"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "fs", "io-util"] }
toml = { version = "1.1.3", features = ["parse", "serde"], default-features = false }
portable_legacy_conf = { version = "1.0.0", path = "./lib/legacy_conf" }

[workspace]
resolver = "3"
members = ["lib/legacy_conf"]