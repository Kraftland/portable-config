name: Build (Debug)

on:
  release:
    types: released
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: ./.github/actions/setup

    - name: Build (Debug)
      run: |
        cargo fetch --locked --target host-tuple
        cargo build --frozen